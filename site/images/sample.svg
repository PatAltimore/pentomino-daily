<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.42" stop-color="#3b2a73"/>
      <stop offset="0.7" stop-color="#c2527a"/>
      <stop offset="0.82" stop-color="#ffb46b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.38" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="1" stop-color="#e3cf94"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0907c"/>
      <stop offset="0.5" stop-color="#5a3f78"/>
      <stop offset="1" stop-color="#121c40"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd3c8"/>
      <stop offset="1" stop-color="#f6e27a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1200" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="70" cy="60" r="2.5"/><circle cx="160" cy="130" r="1.8"/><circle cx="310" cy="70" r="2.8"/>
    <circle cx="420" cy="170" r="2"/><circle cx="530" cy="60" r="3"/><circle cx="640" cy="140" r="1.8"/>
    <circle cx="860" cy="70" r="2.6"/><circle cx="940" cy="190" r="2"/><circle cx="90" cy="360" r="2"/>
    <circle cx="390" cy="330" r="2.4"/><circle cx="560" cy="270" r="1.8"/><circle cx="930" cy="440" r="2.6"/>
    <circle cx="250" cy="480" r="1.8"/><circle cx="470" cy="520" r="2.2"/><circle cx="60" cy="590" r="2.4"/>
    <circle cx="880" cy="600" r="1.8"/><circle cx="700" cy="30" r="2"/><circle cx="215" cy="20" r="1.6"/>
  </g>

  <!-- ringed planet -->
  <g transform="rotate(-18 200 270)">
    <circle cx="200" cy="270" r="72" fill="#6a5acd"/>
    <path d="M140 250 Q200 232 262 252" stroke="#8f82e8" stroke-width="10" fill="none"/>
    <path d="M132 285 Q200 268 270 288" stroke="#4b3fa8" stroke-width="12" fill="none"/>
    <ellipse cx="200" cy="270" rx="140" ry="26" fill="none" stroke="url(#ring)" stroke-width="12"/>
    <path d="M128 262 A72 72 0 0 1 272 262" fill="none"/>
  </g>

  <!-- moon -->
  <circle cx="735" cy="360" r="135" fill="#ffd9a0" opacity="0.18"/>
  <circle cx="735" cy="360" r="112" fill="url(#moon)"/>
  <circle cx="700" cy="330" r="22" fill="#d5c07f" opacity="0.7"/>
  <circle cx="770" cy="395" r="30" fill="#d5c07f" opacity="0.6"/>
  <circle cx="742" cy="318" r="12" fill="#d5c07f" opacity="0.7"/>
  <circle cx="690" cy="400" r="14" fill="#d5c07f" opacity="0.6"/>

  <!-- far mountains -->
  <polygon points="0,760 120,640 230,730 380,560 520,720 640,620 780,740 900,600 1000,700 1000,830 0,830" fill="#4a3a7a"/>
  <polygon points="380,560 340,610 380,600 400,640 430,600 460,610" fill="#d8d4f2" opacity="0.85"/>
  <polygon points="900,600 868,640 895,632 912,664 934,630 958,640" fill="#d8d4f2" opacity="0.85"/>

  <!-- near hills -->
  <polygon points="0,830 0,720 160,770 330,700 470,790 620,730 800,800 1000,740 1000,830" fill="#241c4a"/>

  <!-- lake -->
  <rect x="0" y="830" width="1000" height="370" fill="url(#lake)"/>
  <g stroke="#ffe3b0" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="660" y1="860" x2="820" y2="860"/><line x1="640" y1="900" x2="840" y2="900"/>
    <line x1="680" y1="945" x2="800" y2="945"/><line x1="700" y1="990" x2="780" y2="990"/>
  </g>
  <g stroke="#b7a7e6" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="80" y1="1000" x2="260" y2="1000"/><line x1="120" y1="1060" x2="330" y2="1060"/>
    <line x1="420" y1="1110" x2="640" y2="1110"/><line x1="60" y1="1140" x2="200" y2="1140"/>
  </g>

  <!-- pines on the left shore -->
  <g fill="#0f1a2e">
    <polygon points="70,830 20,930 60,930 10,1030 130,1030 80,930 120,930"/>
    <polygon points="190,840 150,925 180,925 140,1010 240,1010 200,925 230,925"/>
  </g>

  <!-- cabin on the right shore -->
  <polygon points="760,780 840,740 920,780" fill="#2b1b2e"/>
  <rect x="772" y="780" width="136" height="70" fill="#3b2640"/>
  <rect x="800" y="800" width="30" height="30" fill="#ffd36e"/>
  <rect x="860" y="808" width="26" height="42" fill="#1a1020"/>
  <rect x="860" y="740" width="18" height="40" fill="#2b1b2e"/>
</svg>
