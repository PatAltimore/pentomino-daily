name: Fetch daily picture and deploy

on:
  push:
    branches: [main]
  schedule:
    # Hourly, at an off-peak minute. GitHub's scheduler is best-effort and often late or skips
    # runs, so two daily runs left yesterday's puzzles up for hours after the date changed.
    # Running every hour means a missed run is made up for within the hour, and the fetch
    # script skips pictures it already has for today, so most runs change nothing.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      # Remember the pictures fetched so far. They are restored here, so a run only downloads what
      # is new (and a source that is down keeps its earlier pictures), and saved again below.
      - name: Restore last fetched pictures
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/manifest.json
            site/data/20*
            site/images/daily-*
          key: daily-none
          restore-keys: daily-

      # Writes site/data/<day>/<key>.json, site/data/manifest.json and
      # site/images/daily-<key>-<day>.<ext> for a week of puzzle days. Nothing is committed, so the
      # repo doesn't grow by pictures. If nothing at all is available the job fails and the previous
      # deployment stays live.
      - name: Fetch pictures
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          # IMAGE_SOURCE: auto        # auto | apod | wikimedia | artic
          # ALLOW_COPYRIGHTED: 'true' # see README before turning this on
        run: node scripts/fetch-daily.mjs

      # The key is a hash of what was fetched, so an hourly run that changed nothing saves nothing.
      - name: Save fetched pictures
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/manifest.json
            site/data/20*
            site/images/daily-*
          key: daily-${{ hashFiles('site/data/manifest.json', 'site/data/20*/*.json') }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
